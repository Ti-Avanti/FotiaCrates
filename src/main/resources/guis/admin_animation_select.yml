title: "<!i><dark_gray>动画设置"
size: 45

fill:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "

items:
  gui_toggle:
    slot: 10
    material: LIME_DYE
    name: "<!i><green>GUI动画: {gui_animation_enabled}"
    lore:
      - "<!i><gray>玩家界面中的滚动动画"
      - ""
      - "<!i><yellow>点击切换"
    action: toggle_gui_animation
  template:
    slot: 12
    material: PAINTING
    name: "<!i><aqua>动画模板: {animation_template}"
    lore:
      - "<!i><gray>每个抽奖箱可使用独立模板"
      - "<!i><gray>模板位于 guis/animations/"
      - ""
      - "<!i><yellow>点击选择"
    action: open_animation_templates
  roulette:
    slot: 13
    material: CLOCK
    name: "<!i><yellow>轮盘动画"
    lore:
      - "<!i><gray>当前动画: {animation_type}"
      - ""
      - "<!i><yellow>点击选择"
    action: select_roulette
  instant:
    slot: 15
    material: FEATHER
    name: "<!i><white>无动画"
    lore:
      - "<!i><gray>直接显示结果"
      - ""
      - "<!i><yellow>点击选择"
    action: select_instant
  physical_toggle:
    slot: 28
    material: LIME_DYE
    name: "<!i><green>物理动画: {physical_animation_enabled}"
    lore:
      - "<!i><gray>宝箱上方漂浮物品动画"
      - ""
      - "<!i><yellow>点击切换"
    action: toggle_physical_animation
  physical_height:
    slot: 30
    material: LADDER
    name: "<!i><aqua>物理动画高度: {physical_animation_height}"
    lore:
      - "<!i><yellow>左键 +0.1 / 右键 -0.1"
    action: adjust_physical_height
  duration:
    slot: 32
    material: CLOCK
    name: "<!i><light_purple>动画时长: {animation_duration} 秒"
    lore:
      - "<!i><yellow>左键 +1 / 右键 -1"
      - "<!i><aqua>中键输入精确值"
    action: adjust_animation_duration
  info:
    slot: 34
    material: BOOK
    name: "<!i><gold>动画说明"
    lore:
      - "<!i><gray>GUI动画和物理动画可以同时启用"
  back:
    slot: 36
    material: ARROW
    name: "<!i><red>返回"
    lore:
      - "<!i><gray>返回宝箱编辑界面"
    action: back
