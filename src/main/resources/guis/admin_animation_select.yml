title: "<!i><dark_gray>动画设置"
size: 45

fill:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "

items:
  gui_toggle:
    slot: 10
    material: LIME_DYE
    name: "<!i><green>主动画: {gui_animation_enabled}"
    lore:
      - "<!i><gray>当前选择的抽奖动画"
      - ""
      - "<!i><yellow>点击切换"
    action: toggle_gui_animation
  template:
    slot: 12
    material: PAINTING
    name: "<!i><aqua>动画模板: {animation_template}"
    lore:
      - "<!i><gray>每个抽奖箱可使用独立模板"
      - "<!i><gray>模板位于 guis/animations/"
      - ""
      - "<!i><yellow>点击选择"
    action: open_animation_templates
  roulette:
    slot: 19
    material: CLOCK
    name: "<!i><yellow>轮盘动画"
    lore:
      - "<!i><gray>当前动画: {animation_type}"
      - ""
      - "{animation_roulette_state}"
    action: select_roulette
  card_reveal:
    slot: 21
    material: PAPER
    name: "<!i><light_purple>秘匣翻牌"
    lore:
      - "<!i><gray>随机卡牌闪烁奖池后由玩家选择"
      - ""
      - "{animation_card_reveal_state}"
    action: select_card_reveal
  orbital_convergence:
    slot: 23
    material: END_CRYSTAL
    name: "<!i><aqua>星轨汇聚"
    lore:
      - "<!i><gray>奖励围绕宝箱旋转并收束"
      - ""
      - "{animation_orbital_state}"
    action: select_orbital_convergence
  void_rift:
    slot: 25
    material: ENDER_EYE
    name: "<!i><dark_aqua>虚空裂隙"
    lore:
      - "<!i><gray>候选奖励被裂隙吸入，中奖物品降临"
      - ""
      - "{animation_void_rift_state}"
    action: select_void_rift
  meteor_judgment:
    slot: 28
    material: FIRE_CHARGE
    name: "<!i><gold>流星裁决"
    lore:
      - "<!i><gray>诱饵流星落空，金色流星揭晓奖励"
      - ""
      - "{animation_meteor_state}"
    action: select_meteor_judgment
  instant:
    slot: 30
    material: FEATHER
    name: "<!i><white>无动画"
    lore:
      - "<!i><gray>直接显示结果"
      - ""
      - "{animation_instant_state}"
    action: select_instant
  physical_toggle:
    slot: 16
    material: LIME_DYE
    name: "<!i><green>物理动画: {physical_animation_enabled}"
    lore:
      - "<!i><gray>宝箱上方漂浮物品动画"
      - ""
      - "<!i><yellow>点击切换"
    action: toggle_physical_animation
  physical_height:
    slot: 34
    material: LADDER
    name: "<!i><aqua>物理动画高度: {physical_animation_height}"
    lore:
      - "<!i><yellow>左键 +0.1 / 右键 -0.1"
    action: adjust_physical_height
  duration:
    slot: 14
    material: CLOCK
    name: "<!i><light_purple>动画时长: {animation_duration} 秒"
    lore:
      - "<!i><yellow>左键 +1 / 右键 -1"
      - "<!i><aqua>中键输入精确值"
    action: adjust_animation_duration
  preview:
    slot: 32
    material: SPYGLASS
    name: "<!i><green>预览当前动画"
    lore:
      - "<!i><gray>不扣钥匙、不发奖励、不写历史"
      - ""
      - "<!i><yellow>点击播放"
    action: preview_animation
  info:
    slot: 39
    material: BOOK
    name: "<!i><gold>动画说明"
    lore:
      - "<!i><gray>GUI动画和物理动画可以同时启用"
      - "<!i><gray>世界动画使用玩家独立展示实体"
  back:
    slot: 36
    material: ARROW
    name: "<!i><red>返回"
    lore:
      - "<!i><gray>返回宝箱编辑界面"
    action: back
