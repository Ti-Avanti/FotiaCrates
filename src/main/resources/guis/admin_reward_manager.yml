title: "<!i><dark_gray>奖励管理: {crate}"
size: 54

fill:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "

content-slots:
  - 10
  - 11
  - 12
  - 13
  - 14
  - 15
  - 16
  - 19
  - 20
  - 21
  - 22
  - 23
  - 24
  - 25
  - 28
  - 29
  - 30
  - 31
  - 32
  - 33
  - 34
  - 37
  - 38
  - 39
  - 40
  - 41
  - 42
  - 43

items:
  rarity_probability:
    slot: 46
    material: AMETHYST_SHARD
    name: '<!i><light_purple>快捷设置概率'
    lore:
      - '<!i><gray>选择稀有度，批量设置基础百分比'
      - '<!i><gray>预览调整结果，确认后保存'
      - '<!i><yellow>点击打开'
    action: rarity_probability
  back:
    slot: 45
    material: ARROW
    name: "<!i><red>返回"
    lore:
      - "<!i><gray>返回宝箱编辑界面"
    action: back
  previous:
    slot: 48
    material: ARROW
    name: "<!i><yellow>上一页"
    lore:
      - "<!i><gray>{page}/{max_page}"
    unavailable:
      material: YELLOW_STAINED_GLASS_PANE
      name: "<!i><gray>没有上一页"
      lore:
        - "<!i><dark_gray>当前已经是第一页"
    action: previous_page
  info:
    slot: 49
    material: BOOK
    name: "<!i><gold>奖励统计"
    lore:
      - "<!i><gray>奖励数量: <!i><white>{reward_count}"
      - "<!i><gray>总权重: <!i><white>{total_weight}"
  next:
    slot: 50
    material: ARROW
    name: "<!i><yellow>下一页"
    lore:
      - "<!i><gray>{page}/{max_page}"
    unavailable:
      material: YELLOW_STAINED_GLASS_PANE
      name: "<!i><gray>没有下一页"
      lore:
        - "<!i><dark_gray>当前已经是最后一页"
    action: next_page
  balance:
    slot: 52
    material: GOLDEN_APPLE
    name: "<!i><gold>权重调整"
    lore:
      - "<!i><gray>归一化保留原比例，总权重调整为100"
      - "<!i><gray>平均分配会将所有奖励改为相同权重"
      - ""
      - "<!i><yellow>左键 按比例归一化"
      - "<!i><red>Shift+右键 平均分配（改变原概率）"
    action: balance_chances
  add:
    slot: 53
    material: EMERALD
    name: "<!i><green>添加新奖励"
    lore:
      - "<!i><gray>创建一个新的奖励"
      - ""
      - "<!i><yellow>点击添加"
    action: add_reward

# 奖励列表附加说明。支持 {reward_id}、{reward_name}、{weight}、{probability}、{rarity}
reward-display:
  append-item-lore: true
  lore:
    - ''
    - '<!i><gray>ID: <!i><white>{reward_id}'
    - '<!i><gray>权重: <!i><yellow>{weight}'
    - '<!i><gray>概率: <!i><yellow>{probability}'
    - '<!i><gray>稀有度: {rarity}'
    - '{broadcast_line}'
    - ''
    - '<!i><yellow>左键 编辑奖励'
    - '<!i><aqua>中键 复制奖励'
    - '<!i><red>Shift+右键 删除'
  broadcast-line: '<!i><gold>★ 全服广播'
