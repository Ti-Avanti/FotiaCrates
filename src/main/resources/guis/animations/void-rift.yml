# 虚空裂隙世界动画模板
animation-type: VOID_RIFT
display-name: "<!i><dark_aqua>虚空裂隙"
selector:
  material: ENDER_EYE
  name: "<!i><dark_aqua>{template}"
  lore:
    - "<!i><gray>模板ID: <!i><white>{template_id}"
    - "<!i><gray>候选奖励被裂隙吸入，中奖物品降临"
    - ""
    - "{selected_line}"

# 世界动画不会打开此GUI，保留布局用于模板解析
title: "<!i><dark_aqua>虚空裂隙"
layout:
  - "#########"
  - "####I####"
  - "#########"
icons:
  '#':
    display:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
  'I':
    display:
      material: ENDER_EYE
      name: "<!i><dark_aqua>裂隙核心"
animation-slots: []
center-slot: -1

void-rift:
  # 候选物品吸入半径、裂隙高度与最终奖励悬浮高度
  radius: 1.9
  rift-height: 2.6
  result-height: 1.45
  item-count: 7
  rotations: 1.8
  particle-count: 18
