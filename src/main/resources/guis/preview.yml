# 预览GUI配置
# 使用Layout布局方式

title: "<!i><dark_gray>{crate} 预览 ({page}/{total_pages})"

# 开箱按钮的多连抽提示，可用占位符: {amount}
multi-open-hint:
  available: '<!i><yellow>右键 <!i><gray>- 多连抽 {amount} 次'
  unavailable: '<!i><dark_gray>右键多连抽不可用'

# 动态奖励图标的 Lore 设置
reward-display:
  # 是否保留奖励图标原有 Lore，并在其后追加以下内容
  append-item-lore: true
  lore:
    - ''
    - '<!i><gray>稀有度: {rarity}'
    - '{chance_line}'
    - '{broadcast_line}'
  chance-lines:
    percentage: '<!i><gray>概率: <!i><yellow>{probability}'
    weight: '<!i><gray>权重: <!i><yellow>{weight}'
  broadcast-line: '<!i><gold>★ 稀有奖励'

layout:
  - '####I####'
  - '#CCCCCCC#'
  - '#CCCCCCC#'
  - '#CCCCCCC#'
  - '#CCCCCCC#'
  - '<##HO###>'

icons:
  '#':
    display:
      material: gray_stained_glass_pane
      name: ' '

  'C':
    content: true

  'I':
    display:
      material: paper
      name: '<!i><gold>{crate}'
      lore:
        - '<!i><gray>查看此抽奖箱的所有奖励'
        - ''
        - '<!i><yellow>奖励数量: <!i><white>{reward_count}'
        - '<!i><yellow>当前页: <!i><white>{page}/{total_pages}'

  '<':
    display:
      material: arrow
      name: '<!i><yellow>上一页'
      lore:
        - '<!i><gray>点击查看上一页'
    action: prev_page

  '>':
    display:
      material: arrow
      name: '<!i><yellow>下一页'
      lore:
        - '<!i><gray>点击查看下一页'
    action: next_page

  'O':
    display:
      material: chest
      name: '<!i><green>打开抽奖箱'
      lore:
        - '<!i><yellow>左键 <!i><gray>- 单次抽奖'
        - '{multi_open_hint}'
        - ''
        - '<!i><yellow>你拥有 {keys} 把钥匙'
        - '<!i><gray>最大连抽: <!i><white>{multi_open_max}'
    action: open_crate

  'H':
    display:
      material: book
      name: '<!i><aqua>抽奖历史'
      lore:
        - '<!i><gray>查看你在此抽奖箱的抽奖记录'
        - ''
        - '<!i><yellow>点击打开'
    action: open_history
