# FotiaCrates English Language File
# Supports MiniMessage format
# Use <!i> to disable italic

prefix: "<!i><gradient:#FFD700:#FFA500>[FotiaCrates]</gradient> "

messages:
  # General messages
  no-permission: "<!i><red>You don't have permission to do this!"
  no-key: "<!i><red>You don't have enough keys!"
  reward-received: "<!i><green>Congratulations! You received {reward}<!i><green>!"
  broadcast-rare: "<!i><gold>{player} <!i><yellow>got <!i><gold>{reward} <!i><yellow>from <!i><gold>{crate}<!i><yellow>!"
  key-given: "<!i><green>You received {amount} {key}<!i><green>!"
  key-removed: "<!i><red>You lost {amount} {key}<!i><red>!"
  key-given-other: "<!i><green>Gave {player} {amount} {key}<!i><green>!"
  key-removed-other: "<!i><red>Removed {amount} {key} <!i><red>from {player}!"
  key-check: "<!i><yellow>{player} has {amount} {key} <!i><yellow>(Virtual: {virtual}, Physical: {physical})"
  crate-placed: "<!i><green>Crate location has been set!"
  crate-removed: "<!i><green>Crate location has been removed!"
  invalid-crate: "<!i><red>Invalid crate!"
  invalid-key: "<!i><red>Invalid key!"
  invalid-player: "<!i><red>Player not found!"
  inventory-full: "<!i><red>Your inventory is full! Items dropped on the ground."
  overflow-mail-sent: "<!i><yellow>Your inventory was full. {count} item stack(s) were sent to your mailbox."
  overflow-mail-partial: "<!i><yellow>Your inventory was full. {mailed} item stack(s) were mailed and {dropped} item stack(s) were dropped on the ground."
  reload-success: "<!i><green>Configuration reloaded!"
  history-header: "<!i><gold>===== Crate History ====="
  history-entry: "<!i><gray>{time} - {crate}: {reward}"
  history-empty: "<!i><gray>No history found."
  history-cleared: "<!i><green>Cleared {count} history record(s)."
  pity-progress: "<!i><yellow>Pity progress: {current}/{max}"
  not-looking-at-block: "<!i><red>You must be looking at a block!"
  not-crate-location: "<!i><red>This is not a crate location!"
  already-crate-location: "<!i><red>There is already a crate at this location!"
  multi-open-start: "<!i><yellow>Opening {amount} crates..."
  must-be-player: "<!i><red>This command can only be used by players!"
  usage: "<!i><yellow>Usage: {usage}"
  key-not-for-crate: "<!i><red>This key cannot open this crate!"

  # Command help
  help-header: "<!i><gold>===== FotiaCrates Help ====="
  help-open: "<!i><yellow>/crate open <crate> [amount] <!i><gray>- Open a crate"
  help-preview: "<!i><yellow>/crate preview <crate> <!i><gray>- Preview crate rewards"
  help-key-give: "<!i><yellow>/crate key give <player> <key> <amount> [virtual/physical] <!i><gray>- Give keys"
  help-key-take: "<!i><yellow>/crate key take <player> <key> <amount> [virtual/physical] <!i><gray>- Take keys"
  help-key-check: "<!i><yellow>/crate key check <player> [key] <!i><gray>- Check key count"
  help-set: "<!i><yellow>/crate set <crate> <!i><gray>- Set crate location"
  help-remove: "<!i><yellow>/crate remove <!i><gray>- Remove crate location"
  help-history: "<!i><yellow>/crate history [player] <!i><gray>- View crate history"
  help-reload: "<!i><yellow>/crate reload <!i><gray>- Reload configuration"
  help-give: "<!i><yellow>/crate give <player> <crate> [amount] <!i><gray>- Give crate block"
  help-admin: "<!i><yellow>/crate admin <!i><gray>- Open admin panel"
  help-key: "<!i><yellow>/crate key <give|take|check> <!i><gray>- Key management"
  help-reward: "<!i><yellow>/crate reward <add|remove|list|setchance> <!i><gray>- Reward management"
  help-editor: "<!i><yellow>/crate editor <!i><gray>- Open crate editor"
  help-footer: "<!i><gold>=========================="

  # Admin GUI related
  admin-gui-title: "<!i><dark_gray>FotiaCrates Admin"
  admin-create-crate: "<!i><green>Create New Crate"
  admin-edit-crate: "<!i><yellow>Edit Crate"
  admin-delete-crate: "<!i><red>Delete Crate"
  admin-manage-keys: "<!i><aqua>Manage Keys"
  admin-crate-created: "<!i><green>Crate {crate} <!i><green>has been created!"
  admin-crate-deleted: "<!i><red>Crate {crate} <!i><red>has been deleted!"
  admin-crate-saved: "<!i><green>Crate configuration saved!"
  admin-reward-added: "<!i><green>Reward added!"
  admin-reward-removed: "<!i><red>Reward removed!"
  admin-input-name: "<!i><yellow>Please enter a name in chat:"
  admin-input-chance: "<!i><yellow>Please enter a chance (0-100) in chat:"
  admin-input-cancelled: "<!i><red>Input cancelled."

  # Extra messages
  no-block: "<!i><red>You must be looking at a block!"
  no-history: "<!i><gray>No history found."
  crate-set: "<!i><green>Set {crate} <!i><green>at this location!"
  crate-block-received: "<!i><green>You received {amount} {crate} <!i><green>block(s)!"
  crate-block-given: "<!i><green>Gave {player} {amount} {crate} <!i><green>block(s)!"
  crate-block-placed: "<!i><green>Placed {crate} <!i><green>crate!"
  crate-break-denied: "<!i><red>Cannot break crate! Use sneak + left-click to remove."
  pending-rewards-available: "<!i><gold>You have {count} pending reward(s)! Use /crate claim to collect."
  pending-reward-claimed: "<!i><green>Claimed reward: {reward}"
  no-pending-rewards: "<!i><gray>You have no pending rewards."

  # Reward management commands
  player-only: "<!i><red>This command can only be used by players!"
  reward-add-usage: "<!i><yellow>Usage: /crate reward add <crateId> [chance] [rarity]"
  reward-remove-usage: "<!i><yellow>Usage: /crate reward remove <crateId> <rewardId>"
  reward-list-usage: "<!i><yellow>Usage: /crate reward list <crateId>"
  reward-setchance-usage: "<!i><yellow>Usage: /crate reward setchance <crateId> <rewardId> <chance>"
  reward-hold-item: "<!i><red>Please hold the item you want to add as a reward!"
  invalid-number: "<!i><red>Invalid number!"
  reward-added: "<!i><green>Added {reward} <!i><green>to {crate}<!i><green>! Chance: {chance}%, Rarity: {rarity}"
  reward-removed: "<!i><green>Removed reward {reward} <!i><green>from {crate}<!i><green>!"
  reward-not-found: "<!i><red>Reward not found!"
  reward-save-failed: "<!i><red>Failed to save reward! Check console."
  reward-list-empty: "<!i><gray>{crate} has no rewards."
  reward-list-header: "<!i><gold>===== Rewards for {crate} <!i><gold>({count}) ====="
  reward-list-entry: "<!i><gray>- {id}: {name} <!i><yellow>({chance}%) <!i><gray>[{rarity}]"
  reward-chance-updated: "<!i><green>Set {reward} <!i><green>chance to {chance}%!"

  # Key management messages
  admin-key-created: "<!i><green>Key {key} <!i><green>has been created!"
  admin-key-deleted: "<!i><red>Key {key} <!i><red>has been deleted!"
  admin-key-saved: "<!i><green>Key configuration saved!"
  admin-key-exists: "<!i><red>This key ID already exists!"
  admin-key-name-updated: "<!i><green>Key name updated to {name}<!i><green>!"
  admin-key-item-updated: "<!i><green>Key item updated!"
  admin-key-crate-added: "<!i><green>Added crate {crate}<!i><green>!"
  admin-key-crate-removed: "<!i><red>Removed crate {crate}<!i><red>!"

  # Crate edit messages
  admin-crate-name-updated: "<!i><green>Crate name updated to {name}<!i><green>!"
  admin-crate-exists: "<!i><red>This crate ID already exists!"
  admin-animation-updated: "<!i><green>Animation type updated to {type}!"
  admin-animation-duration-updated: "<!i><green>Animation duration updated to {duration} seconds!"
  admin-multi-open-updated: "<!i><green>Multi-open max updated to {max}!"
  admin-block-updated: "<!i><green>Crate block updated!"
  admin-shift-to-delete: "<!i><red>Hold Shift and click to confirm deletion!"
  admin-feature-coming-soon: "<!i><yellow>This feature is coming soon!"
  admin-input-duration: "<!i><yellow>Please enter animation duration (seconds) in chat:"
  admin-input-max-open: "<!i><yellow>Please enter multi-open max in chat:"
  admin-input-particle-type: "<!i><yellow>Please enter particle type (e.g. FLAME, END_ROD, DUST, HAPPY_VILLAGER):"
  admin-input-particle-color: "<!i><yellow>Please enter particle color (#RRGGBB):"
  admin-particles-updated: "<!i><green>Particle setting updated: {field}"
  admin-particles-preview: "<!i><green>Particle preview played."
  invalid-particle: "<!i><red>Invalid particle type, or unsupported by the current server version!"
  invalid-color: "<!i><red>Invalid color format. Use #RRGGBB."
  admin-input-command: "<!i><yellow>Please enter command in chat (use %player% as player placeholder):"
  admin-reward-command-added: "<!i><green>Command added to reward!"
  admin-reward-command-removed: "<!i><red>Command removed from reward!"
  admin-reward-broadcast-toggled: "<!i><yellow>Broadcast {status}!"
  admin-reward-copied: "<!i><green>Reward copied!"
  admin-reward-balanced: "<!i><green>All reward chances balanced to 100%!"
  admin-quick-add-tip: "<!i><yellow>Hold an item and click empty slot to quick add reward"
  admin-hold-block: "<!i><red>Please hold the block you want to set!"
  admin-pity-tier-added: "<!i><green>Pity tier added!"
  admin-pity-tier-removed: "<!i><red>Pity tier removed!"
  admin-input-pity-count: "<!i><yellow>Please enter pity count in chat:"
  admin-reward-item-cleared: "<!i><green>Reward item cleared, will use display icon as reward!"

  # Rarity management messages
  admin-rarity-created: "<!i><green>Rarity {rarity} <!i><green>has been created!"
  admin-rarity-deleted: "<!i><red>Rarity {rarity} <!i><red>has been deleted!"
  admin-rarity-exists: "<!i><red>This rarity ID already exists!"
  admin-input-color: "<!i><yellow>Please enter color in chat (e.g., gold, red, blue):"
