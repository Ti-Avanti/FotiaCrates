# FotiaCrates 中文语言文件
# 支持 MiniMessage 格式
# 使用 <!i> 禁用斜体

prefix: "<!i><gradient:#FFD700:#FFA500>[FotiaCrates]</gradient> "

messages:
  # 通用消息
  no-permission: "<!i><red>你没有权限执行此操作！"
  no-key: "<!i><red>你没有足够的钥匙！"
  reward-received: "<!i><green>恭喜！你获得了 {reward}！"
  broadcast-rare: "<!i><gold>{player} <!i><yellow>从 <!i><gold>{crate} <!i><yellow>中获得了 <!i><gold>{reward}<!i><yellow>！"
  key-given: "<!i><green>你获得了 {amount} 把 {key}！"
  key-removed: "<!i><red>你被移除了 {amount} 把 {key}！"
  key-given-other: "<!i><green>已给予 {player} {amount} 把 {key}！"
  key-removed-other: "<!i><red>已从 {player} 移除 {amount} 把 {key}！"
  key-check: "<!i><yellow>{player} 拥有 {amount} 把 {key} (虚拟: {virtual}, 物理: {physical})"
  crate-placed: "<!i><green>抽奖箱位置已设置！"
  crate-removed: "<!i><green>抽奖箱位置已移除！"
  invalid-crate: "<!i><red>无效的抽奖箱！"
  invalid-key: "<!i><red>无效的钥匙！"
  invalid-player: "<!i><red>找不到该玩家！"
  inventory-full: "<!i><red>你的背包已满！物品已掉落在地上。"
  reload-success: "<!i><green>配置已重新加载！"
  history-header: "<!i><gold>===== 抽奖历史 ====="
  history-entry: "<!i><gray>{time} - {crate}: {reward}"
  history-empty: "<!i><gray>没有找到历史记录。"
  pity-progress: "<!i><yellow>保底进度: {current}/{max}"
  not-looking-at-block: "<!i><red>你必须看着一个方块！"
  not-crate-location: "<!i><red>这不是一个抽奖箱位置！"
  already-crate-location: "<!i><red>这个位置已经有抽奖箱了！"
  multi-open-start: "<!i><yellow>正在打开 {amount} 个抽奖箱..."
  must-be-player: "<!i><red>此命令只能由玩家使用！"
  usage: "<!i><yellow>用法: {usage}"
  key-not-for-crate: "<!i><red>这把钥匙不能打开这个抽奖箱！"

  # 命令帮助
  help-header: "<!i><gold>===== FotiaCrates 帮助 ====="
  help-open: "<!i><yellow>/crate open <抽奖箱> [数量] <!i><gray>- 打开抽奖箱"
  help-preview: "<!i><yellow>/crate preview <抽奖箱> <!i><gray>- 预览抽奖箱奖励"
  help-key-give: "<!i><yellow>/crate key give <玩家> <钥匙> <数量> [virtual/physical] <!i><gray>- 给予钥匙"
  help-key-take: "<!i><yellow>/crate key take <玩家> <钥匙> <数量> [virtual/physical] <!i><gray>- 移除钥匙"
  help-key-check: "<!i><yellow>/crate key check <玩家> [钥匙] <!i><gray>- 查看钥匙数量"
  help-set: "<!i><yellow>/crate set <抽奖箱> <!i><gray>- 设置抽奖箱位置"
  help-remove: "<!i><yellow>/crate remove <!i><gray>- 移除抽奖箱位置"
  help-history: "<!i><yellow>/crate history [玩家] <!i><gray>- 查看抽奖历史"
  help-reload: "<!i><yellow>/crate reload <!i><gray>- 重载配置"
  help-give: "<!i><yellow>/crate give <玩家> <宝箱> [数量] <!i><gray>- 给予宝箱方块"
  help-reward: "<!i><yellow>/crate reward <add|remove|list|setchance> <!i><gray>- 奖励管理"
  help-editor: "<!i><yellow>/crate editor <!i><gray>- 打开宝箱编辑器"
  help-admin: "<!i><yellow>/crate admin <!i><gray>- 打开管理界面"
  help-key: "<!i><yellow>/crate key <give|take|check> <!i><gray>- 钥匙管理"
  help-footer: "<!i><gold>=========================="

  # 管理GUI相关
  admin-gui-title: "<!i><dark_gray>FotiaCrates 管理"
  admin-create-crate: "<!i><green>创建新抽奖箱"
  admin-edit-crate: "<!i><yellow>编辑抽奖箱"
  admin-delete-crate: "<!i><red>删除抽奖箱"
  admin-manage-keys: "<!i><aqua>管理钥匙"
  admin-crate-created: "<!i><green>抽奖箱 {crate} 已创建！"
  admin-crate-deleted: "<!i><red>抽奖箱 {crate} 已删除！"
  admin-crate-saved: "<!i><green>抽奖箱配置已保存！"
  admin-reward-added: "<!i><green>奖励已添加！"
  admin-reward-removed: "<!i><red>奖励已移除！"
  admin-input-name: "<!i><yellow>请在聊天中输入名称："
  admin-input-chance: "<!i><yellow>请在聊天中输入概率（0-100）："
  admin-input-cancelled: "<!i><red>输入已取消。"

  # 额外消息
  no-block: "<!i><red>你必须看着一个方块！"
  no-history: "<!i><gray>没有找到历史记录。"
  crate-set: "<!i><green>已将 {crate} 设置到此位置！"
  crate-block-received: "<!i><green>你获得了 {amount} 个 {crate} 方块！"
  crate-block-given: "<!i><green>已给予 {player} {amount} 个 {crate} 方块！"
  crate-block-placed: "<!i><green>已放置 {crate} 抽奖箱！"
  crate-break-denied: "<!i><red>无法破坏抽奖箱！请蹲下+左键移除。"
  pending-rewards-available: "<!i><gold>你有 {count} 个待领取的奖励！使用 /crate claim 领取。"
  pending-reward-claimed: "<!i><green>已领取奖励: {reward}"
  no-pending-rewards: "<!i><gray>你没有待领取的奖励。"

  # 奖励管理命令
  player-only: "<!i><red>此命令只能由玩家执行！"
  reward-add-usage: "<!i><yellow>用法: /crate reward add <宝箱ID> [概率] [稀有度]"
  reward-remove-usage: "<!i><yellow>用法: /crate reward remove <宝箱ID> <奖励ID>"
  reward-list-usage: "<!i><yellow>用法: /crate reward list <宝箱ID>"
  reward-setchance-usage: "<!i><yellow>用法: /crate reward setChance <宝箱ID> <奖励ID> <概率>"
  reward-hold-item: "<!i><red>请手持要添加为奖励的物品！"
  invalid-number: "<!i><red>无效的数字！"
  reward-added: "<!i><green>已将 {reward} 添加到 {crate}！概率: {chance}%, 稀有度: {rarity}"
  reward-removed: "<!i><green>已从 {crate} 移除奖励 {reward}！"
  reward-not-found: "<!i><red>找不到该奖励！"
  reward-save-failed: "<!i><red>保存奖励失败！请查看控制台。"
  reward-list-empty: "<!i><gray>{crate} 没有任何奖励。"
  reward-list-header: "<!i><gold>===== {crate} 的奖励列表 ({count}个) ====="
  reward-list-entry: "<!i><gray>- {id}: {name} <!i><yellow>({chance}%) <!i><gray>[{rarity}]"
  reward-chance-updated: "<!i><green>已将 {reward} 的概率设置为 {chance}%！"

  # 钥匙管理消息
  admin-key-created: "<!i><green>钥匙 {key} 已创建！"
  admin-key-deleted: "<!i><red>钥匙 {key} 已删除！"
  admin-key-saved: "<!i><green>钥匙配置已保存！"
  admin-key-exists: "<!i><red>该钥匙ID已存在！"
  admin-key-name-updated: "<!i><green>钥匙名称已更新为 {name}！"
  admin-key-item-updated: "<!i><green>钥匙物品已更新！"
  admin-key-crate-added: "<!i><green>已添加宝箱 {crate}！"
  admin-key-crate-removed: "<!i><red>已移除宝箱 {crate}！"

  # 宝箱编辑消息
  admin-crate-name-updated: "<!i><green>宝箱名称已更新为 {name}！"
  admin-crate-saved: "<!i><green>宝箱配置已保存！"
  admin-crate-deleted: "<!i><red>宝箱 {crate} 已删除！"
  admin-crate-created: "<!i><green>宝箱 {crate} 已创建！"
  admin-crate-exists: "<!i><red>该宝箱ID已存在！"
  admin-animation-updated: "<!i><green>动画类型已更新为 {type}！"
  admin-animation-duration-updated: "<!i><green>动画时长已更新为 {duration} 秒！"
  admin-multi-open-updated: "<!i><green>多连抽最大数量已更新为 {max}！"
  admin-block-updated: "<!i><green>宝箱方块已更新！"
  admin-shift-to-delete: "<!i><red>请按住Shift键点击确认删除！"
  admin-feature-coming-soon: "<!i><yellow>此功能即将推出！"
  admin-input-duration: "<!i><yellow>请在聊天中输入动画时长（秒）："
  admin-input-max-open: "<!i><yellow>请在聊天中输入多连抽最大数量："
  admin-input-command: "<!i><yellow>请在聊天中输入命令（使用 %player% 作为玩家占位符）："
  admin-input-chance: "<!i><yellow>请在聊天中输入概率（0.01-100）："
  admin-reward-command-added: "<!i><green>命令已添加到奖励！"
  admin-reward-command-removed: "<!i><red>命令已从奖励移除！"
  admin-reward-broadcast-toggled: "<!i><yellow>广播已{status}！"
  admin-reward-copied: "<!i><green>奖励已复制！"
  admin-reward-balanced: "<!i><green>所有奖励概率已平衡为100%！"
  admin-quick-add-tip: "<!i><yellow>手持物品点击空槽位即可快速添加奖励"
  admin-hold-block: "<!i><red>请手持要设置的方块！"
  admin-pity-tier-added: "<!i><green>保底等级已添加！"
  admin-pity-tier-removed: "<!i><red>保底等级已删除！"
  admin-input-pity-count: "<!i><yellow>请在聊天中输入保底次数："
  admin-reward-item-cleared: "<!i><green>奖励物品已清除，将使用显示图标作为奖励！"

  # 稀有度管理消息
  admin-rarity-created: "<!i><green>稀有度 {rarity} 已创建！"
  admin-rarity-deleted: "<!i><red>稀有度 {rarity} 已删除！"
  admin-rarity-exists: "<!i><red>该稀有度ID已存在！"
  admin-input-color: "<!i><yellow>请在聊天中输入颜色（如: gold, red, blue）："
  admin-input-rarity-id: "<!i><yellow>请在聊天中输入稀有度ID："
