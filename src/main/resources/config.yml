# FotiaCrates 主配置文件

# 数据库设置
database:
  # 数据库类型: sqlite 或 mysql
  type: sqlite

  # MySQL 设置，仅当 type 为 mysql 时生效
  mysql:
    host: localhost
    port: 3306
    database: fotiacrates
    username: root
    password: ""
    pool:
      # 最大连接数；当前持久化写入保持有序，通常无需设置过大
      maximum-size: 4
      # 最小空闲连接数
      minimum-idle: 1

  # SQLite 设置，仅当 type 为 sqlite 时生效
  sqlite:
    file: data.db

# 稀有度配置
# display-name 用于显示，支持 MiniMessage
rarities:
  common:
    display-name: "<!i><gray>普通"
    color: "gray"
  uncommon:
    display-name: "<!i><green>稀有"
    color: "green"
  rare:
    display-name: "<!i><blue>精良"
    color: "blue"
  epic:
    display-name: "<!i><dark_purple>史诗"
    color: "dark_purple"
  legendary:
    display-name: "<!i><gold>传说"
    color: "gold"
  mythic:
    display-name: "<!i><light_purple>神话"
    color: "light_purple"

# 全息显示设置
hologram:
  # 是否启用全息显示
  enabled: true
  # 全息显示高度偏移，相对于宝箱方块
  height-offset: 1.5
  # 全息显示缩放
  scale: 1.0
  # 全息显示内容
  # 可用占位符: {crate_name} {crate_id} {keys}
  lines:
    - "<!i><gold>{crate_name}"
    - "<!i><gray>钥匙: <yellow>{keys}"
    - "<!i><gray>左键预览 | 右键开启"

# 全局设置
settings:
  # 默认语言，对应 lang/ 文件名，不带 .yml
  default-language: zh_CN
  # 默认启用动画
  default-animation: true
  # 是否全服广播稀有奖励
  broadcast-rare-rewards: true
  # 是否保存抽奖历史
  save-history: true
  # 每个玩家最大历史记录数，0 表示不限制
  max-history-entries: 100

# 异步数据持久化设置
persistence:
  # 将缓存中的虚拟钥匙和保底写入数据库的间隔，单位为 tick
  flush-interval-ticks: 20
  # 异步数据库任务队列上限，防止数据库异常时无限占用内存；修改后需重启生效
  executor-queue-capacity: 1024
  # 插件关闭时等待异步数据落盘的最长时间，单位为毫秒
  shutdown-flush-timeout-millis: 5000
  history:
    # 单次批量写入的最大历史记录数
    batch-size: 100
    # 历史写入队列上限；队列满时跳过新历史以保护服务器 TPS，修改后需重启生效
    queue-capacity: 10000
    # 同一玩家历史裁剪的最小间隔，单位为秒
    cleanup-interval-seconds: 300

# 性能保护设置
performance:
  models:
    # 模型健康检查间隔，单位为 tick
    health-check-interval-ticks: 100
    # 每次检查的最大抽奖箱数量，避免大量模型在同一 tick 内处理
    max-checks-per-run: 16
  pending-rewards:
    # 单次在主线程发放的待领取奖励数量
    claim-batch-size: 10
    # 离线奖励写入失败后的首次重试间隔，单位为 tick，后续会指数退避
    insert-retry-delay-ticks: 100
    # 发奖代码抛出异常后的处理：RETRY=释放并允许下次重领，LOCK=锁定供管理员核查
    delivery-error-policy: RETRY
    # 数据库确认失败后的重试次数；超过后锁定记录以避免重复发放
    finalize-retry-count: 5
    # 首次重试等待时间，单位为 tick，后续会指数退避
    finalize-retry-delay-ticks: 20
  multi-open:
    # 所有命令、GUI 和实体交互共同遵守的多连抽安全上限
    hard-limit: 100
  particles:
    # 只播放玩家附近该距离内的待机粒子，单位为方块
    idle-view-distance: 32.0
    # 单个 tick 最多处理的待机粒子箱子数量
    max-idle-crates-per-tick: 128
    # 全服同时运行的阶段粒子任务上限；超过时仍播放首帧
    max-active-stage-effects: 128
    # 命令或 GUI 开箱时寻找附近实体箱子的位置范围，单位为方块
    stage-location-search-distance: 64.0

# 编辑器设置
editor:
  rewards:
    # 设置奖励物品后，是否默认用第一个奖励物品同步奖励图标和名称
    auto-display-from-first-item:
      # 总开关
      enabled: true
      # 同步奖励图标
      apply-icon: true
      # 同步奖励显示名称
      apply-name: true
      # 仅在该奖励未手动修改过图标/名称时同步；关闭后每次保存奖励物品都会覆盖
      only-when-not-customized: true

# 背包溢出邮件补发
overflow-mail:
  # 是否启用 SweetMail 溢出邮件补发
  enabled: true
  # SweetMail 邮件图标
  # 示例:
  # "CHEST"
  # "PAPER#1001"
  # "itemsadder-example_item"
  # "mythic-example_item"
  # "head-base64-xxxx"
  # "craftengine-namespace:item_id"
  # "neigeitems-item_id;1"
  icon: "CHEST"
  # 系统邮件发件人显示名
  sender-display: "<!i><gold>FotiaCrates"
  # 邮件标题
  title: "<!i><yellow>抽奖奖励补发"
  # 邮件正文
  content:
    - "<!i><gray>你的背包空间不足。"
    - "<!i><gray>多余的奖励物品已发送到邮箱。"
    - "<!i><yellow>请输入 /mail inbox 查收。"
