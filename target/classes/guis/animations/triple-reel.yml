# 三轴老虎机动画模板
animation-type: TRIPLE_REEL
display-name: "<!i><gold>鎏金三轴老虎机"
selector:
  material: GOLD_INGOT
  name: "<!i><gold>{template}"
  lore:
    - "<!i><gray>模板ID: <!i><white>{template_id}"
    - "<!i><gray>三列奖励从左到右依次停止"
    - ""
    - "{selected_line}"

title: "<!i><gold>幸运三轴老虎机"

layout:
  - "####I####"
  - "##A#A#A##"
  - "##A#A#A##"
  - "##A#A#A##"
  - "####I####"

icons:
  '#':
    display:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
  'I':
    display:
      material: ORANGE_STAINED_GLASS_PANE
      name: "<!i><gold>中奖线"
  'A':
    content: true

# 按上、中、下三行排列，每列组成一条转轴
animation-slots: [11, 13, 15, 20, 22, 24, 29, 31, 33]
center-slot: 22

triple-reel:
  # 三列停止之间的间隔
  stop-gap-ticks: 10
  # 每次滚动的间隔
  spin-interval-ticks: 2
