# 历史记录GUI配置
# 使用Layout布局方式

title: "<!i><dark_gray>{player} 的抽奖历史"

layout:
  - '#########'
  - '#CCCCCCC#'
  - '#CCCCCCC#'
  - '#CCCCCCC#'
  - '#CCCCCCC#'
  - 'B#P#I#N#X'

icons:
  '#':
    display:
      material: gray_stained_glass_pane
      name: ' '

  'C':
    content: true

  'B':
    display:
      material: arrow
      name: '<!i><yellow>返回'
      lore:
        - '<!i><gray>返回上一界面'
    action: back

  'P':
    display:
      material: arrow
      name: '<!i><yellow>上一页'
      lore:
        - '<!i><gray>点击查看上一页'
      unavailable:
        material: yellow_stained_glass_pane
        name: '<!i><gray>没有上一页'
        lore:
          - '<!i><dark_gray>当前已经是第一页'
    action: prev_page

  'I':
    display:
      material: paper
      name: '<!i><gold>第 {page}/{max_page} 页'
      lore:
        - '<!i><gray>共 {total} 条记录'

  'N':
    display:
      material: arrow
      name: '<!i><yellow>下一页'
      lore:
        - '<!i><gray>点击查看下一页'
      unavailable:
        material: yellow_stained_glass_pane
        name: '<!i><gray>没有下一页'
        lore:
          - '<!i><dark_gray>当前已经是最后一页'
    action: next_page

  'X':
    display:
      material: barrier
      name: '<!i><red>清空历史'
      lore:
        - '<!i><gray>清空所有抽奖历史'
        - ''
        - '<!i><red>此操作不可撤销！'
    action: clear_history
