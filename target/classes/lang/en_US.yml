  admin-reward-weights-equalized: '<!i><green>Weights distributed equally. All rewards now have equal base chances.'
  admin-reward-weights-failed: '<!i><red>Could not update weights. Check reward settings and the console.'
  admin-auto-display-disabled: 'Disabled'
  admin-auto-display-manual: 'Manual'
  admin-auto-display-waiting: 'Waiting for a reward item'
  admin-auto-display-enabled: 'Automatic'
  admin-reward-auto-display-pending: '<!i><yellow>Sync did not complete. Check saved reward items, auto-sync settings and the console.'
  # General messages
  no-permission: "<!i><red>You don't have permission to do this!"
  # {keys}/{key}: accepted key names (alternatives); {crate}: crate name
  # {required}: required amount; {owned}: owned total; {missing}: shortfall
  no-key: "<!i><red>Not enough keys! You need {keys}<!i><red> ({missing} more; required: {required}, owned: {owned})."
  # Appended to legacy custom no-key messages without {keys}/{key}; empty disables it.
  no-key-detail: " <!i><red>You need {keys}<!i><red> ({missing} more; required: {required}, owned: {owned})."
  no-key-separator: "<!i><gray> or "
  no-key-configured: "<!i><red>No keys are configured for {crate}<!i><red>. Please contact an administrator."
  player-data-loading: "<!i><yellow>Your data is still synchronizing. Please try again shortly."
  player-data-save-failed: "<!i><red>Data saving failed. This crate opening was cancelled."
  reward-received: "<!i><green>Congratulations! You received {reward}<!i><green>!"
