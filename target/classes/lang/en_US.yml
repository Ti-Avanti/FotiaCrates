  rarity-probability-disabled: '<!i><red>Rarity probability editing is disabled or your authorization has expired.'
  rarity-probability-busy: '<!i><yellow>Probabilities are being saved. Wait before editing or reloading.'
  rarity-probability-stale: '<!i><red>The pool changed. Nothing was applied; reopen the probability editor.'
  rarity-probability-save-failed: '<!i><red>Could not save probabilities. Check the console.'
  rarity-probability-saved: '<!i><green>Base probabilities saved. Other rewards keep their relative proportions.'
  rarity-probability-gui-invalid: '<!i><red>Missing content slots or item template. Check the probability GUI configuration.'
