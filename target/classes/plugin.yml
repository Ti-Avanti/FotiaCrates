name: FotiaCrates
version: 1.1.0
main: gg.fotia.crates.FotiaCrates
api-version: '1.20'
authors:
  - Fotia
description: Feature-rich Minecraft crate plugin
depend:
  - packetevents
softdepend:
  - Vault
  - PlaceholderAPI
  - ModelEngine
  - BetterModel
  - CraftEngine
  - SweetMail

commands:
  crate:
    description: FotiaCrates main command
    usage: /<command> [args]
    aliases:
      - crates
      - fc

permissions:
  fotiacrates.use:
    description: Use crate commands
    default: true
  fotiacrates.preview:
    description: Preview crate rewards
    default: true
  fotiacrates.claim:
    description: Claim pending rewards
    default: true
  fotiacrates.history:
    description: View your crate history
    default: true
  fotiacrates.history.others:
    description: View other players' crate history
    default: op
  fotiacrates.open.*:
    description: Open all crates
    default: op
  fotiacrates.admin.*:
    description: All admin permissions
    default: op
    children:
      fotiacrates.admin.key: true
      fotiacrates.admin.give: true
      fotiacrates.admin.place: true
      fotiacrates.admin.set: true
      fotiacrates.admin.remove: true
      fotiacrates.admin.reload: true
      fotiacrates.admin.editor: true
  fotiacrates.admin.key:
    description: Manage keys
    default: op
  fotiacrates.admin.give:
    description: Give crate blocks
    default: op
  fotiacrates.admin.place:
    description: Place crate blocks
    default: op
  fotiacrates.admin.set:
    description: Set crate locations
    default: op
  fotiacrates.admin.remove:
    description: Remove crate locations
    default: op
  fotiacrates.admin.reload:
    description: Reload plugin configuration
    default: op
  fotiacrates.admin.editor:
    description: Open admin editor GUI
    default: op
