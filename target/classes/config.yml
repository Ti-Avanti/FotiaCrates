# FotiaCrates 主配置文件

# 数据库设置
database:
  # 数据库类型: sqlite 或 mysql
  type: sqlite

  # MySQL 设置，仅当 type 为 mysql 时生效
  mysql:
    host: localhost
    port: 3306
    database: fotiacrates
    username: root
    password: ""

  # SQLite 设置，仅当 type 为 sqlite 时生效
  sqlite:
    file: data.db

# 稀有度配置
# display-name 用于显示，支持 MiniMessage
rarities:
  common:
    display-name: "<!i><gray>普通"
    color: "gray"
  uncommon:
    display-name: "<!i><green>稀有"
    color: "green"
  rare:
    display-name: "<!i><blue>精良"
    color: "blue"
  epic:
    display-name: "<!i><dark_purple>史诗"
    color: "dark_purple"
  legendary:
    display-name: "<!i><gold>传说"
    color: "gold"
  mythic:
    display-name: "<!i><light_purple>神话"
    color: "light_purple"

# 全息显示设置
hologram:
  # 是否启用全息显示
  enabled: true
  # 全息显示高度偏移，相对于宝箱方块
  height-offset: 1.5
  # 全息显示缩放
  scale: 1.0
  # 全息显示内容
  # 可用占位符: {crate_name} {crate_id} {keys}
  lines:
    - "<!i><gold>{crate_name}"
    - "<!i><gray>钥匙: <yellow>{keys}"
    - "<!i><gray>左键预览 | 右键开启"

# 全局设置
settings:
  # 默认语言，对应 lang/ 文件名，不带 .yml
  default-language: zh_CN
  # 默认启用动画
  default-animation: true
  # 是否全服广播稀有奖励
  broadcast-rare-rewards: true
  # 是否保存抽奖历史
  save-history: true
  # 每个玩家最大历史记录数，0 表示不限制
  max-history-entries: 100

# 编辑器设置
editor:
  rewards:
    # 设置奖励物品后，是否默认用第一个奖励物品同步奖励图标和名称
    auto-display-from-first-item:
      # 总开关
      enabled: true
      # 同步奖励图标
      apply-icon: true
      # 同步奖励显示名称
      apply-name: true
      # 仅在该奖励未手动修改过图标/名称时同步；关闭后每次保存奖励物品都会覆盖
      only-when-not-customized: true

# 背包溢出邮件补发
overflow-mail:
  # 是否启用 SweetMail 溢出邮件补发
  enabled: true
  # SweetMail 邮件图标
  # 示例:
  # "CHEST"
  # "PAPER#1001"
  # "itemsadder-example_item"
  # "mythic-example_item"
  # "head-base64-xxxx"
  # "craftengine-namespace:item_id"
  # "neigeitems-item_id;1"
  icon: "CHEST"
  # 系统邮件发件人显示名
  sender-display: "<!i><gold>FotiaCrates"
  # 邮件标题
  title: "<!i><yellow>抽奖奖励补发"
  # 邮件正文
  content:
    - "<!i><gray>你的背包空间不足。"
    - "<!i><gray>多余的奖励物品已发送到邮箱。"
    - "<!i><yellow>请输入 /mail inbox 查收。"
